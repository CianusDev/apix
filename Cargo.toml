[package]
name = "apix"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13", features = ["json", "cookies"] }
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.101"
thiserror = "2.0.18"
ratatui = "0.30.0"
crossterm = "0.29.0"
base64 = "0.22"
arboard = "3"

[dev-dependencies]
tempfile = "3"
